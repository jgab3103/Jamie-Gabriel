<style>

/* =========================
   BASE (MATCH SITE)
   ========================= */

:root {
    --accent: #8B2E3C;
}

html {
    scroll-behavior: smooth;
    background: #FAFAFA;
}

body {
    margin: 0;
    font-family: 'Nunito', sans-serif;
    background: #FAFAFA;
    color: #111;
    line-height: 1.75;
    font-size: 16.5px;
    padding-top: 80px;
}

/* LINKS */
a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid rgba(139, 46, 60, 0.35);
    transition: all 0.2s ease;
}

a:hover {
    color: #111;
    border-bottom-color: rgba(139, 46, 60, 0.75);
}

/* NAV */
#mainNav,
#mainNav.navbar-shrink {
    background: #FAFAFA !important;
    border-bottom: 1px solid rgba(0,0,0,0.05);
    min-height: 80px;
}

#mainNav a {
    color: #111 !important;
    text-decoration: none !important;
}

/* =========================
   PAGE LAYOUT
   ========================= */

.page {
    max-width: 1000px;
    margin: auto;
    padding: 80px 24px 140px;
}

h1 {
    font-family: 'Varela Round', sans-serif;
    font-size: 2rem;
    margin-bottom: 10px;
}

.back-link {
    display: inline-block;
    margin-bottom: 40px;
    color: rgba(0,0,0,0.6);
    font-size: 0.95rem;
}

/* =========================
   RECORDING ROWS
   ========================= */

.recording {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 40px;
    padding: 28px 0;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    align-items: start;
}

.recording:last-child {
    border-bottom: none;
}

/* IMAGE TILE (COLOUR VERSION) */
.media-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 12px;
    overflow: hidden;

    transition: opacity 0.3s ease, transform 0.3s ease;
}

.recording:hover .media-wrapper {
    opacity: 0.92;
    transform: scale(1.01);
}

.media-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

/* TEXT BLOCK */
.recording-text h2 {
    font-family: 'Varela Round', sans-serif;
    font-size: 1.2rem;
    margin: 0 0 10px;
    font-weight: 500;
}

.recording-meta {
    font-size: 0.95rem;
    color: rgba(0,0,0,0.6);
    margin-bottom: 12px;
}

.recording-text p {
    max-width: 65ch;
    margin: 0;
    font-size: 0.98rem;
    color: rgba(0,0,0,0.75);
}

/* RESPONSIVE */
@media (max-width: 900px) {
    .recording {
        grid-template-columns: 1fr;
        gap: 16px;
    }
}

</style>

</head>

    </div>
</nav>

<div class="page">

    <h1>Recordings</h1>
    <a class="back-link" href="./index.html">← Back</a>

    <!-- RECORDING 1 -->

        <div class="media-wrapper">

        </div>
        <div class="recording-text">
            <h2><a href="https://sajaproject.com/">SAJA Project</a></h2>
            <div class="recording-meta">Studio Recording - 2025<br/>
                Album recorded with <a href="https://sallyjamila.com/">Sally Jamila</a> 
            </p>
        </div>
    </div>
